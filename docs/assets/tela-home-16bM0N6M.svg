<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tienda Tela">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8EA"/>
      <stop offset="45%" stop-color="#F2E0CE"/>
      <stop offset="100%" stop-color="#CDB8AD"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A96B86"/>
      <stop offset="100%" stop-color="#6F445B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D38A"/>
      <stop offset="100%" stop-color="#D7A54D"/>
    </linearGradient>
    <pattern id="stitch" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="#8A5D72" opacity="0.28"/>
      <circle cx="31" cy="21" r="2" fill="#8A5D72" opacity="0.28"/>
      <circle cx="18" cy="34" r="2" fill="#8A5D72" opacity="0.28"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#624B41" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#stitch)" opacity="0.7"/>

  <g opacity="0.22">
    <circle cx="90" cy="86" r="40" fill="#8A5D72"/>
    <circle cx="1088" cy="92" r="50" fill="#6F8C8A"/>
    <circle cx="1040" cy="790" r="62" fill="#C08D55"/>
    <circle cx="120" cy="784" r="56" fill="#8E6775"/>
  </g>

  <rect x="60" y="68" width="1080" height="764" rx="42" fill="rgba(255,255,255,0.42)" stroke="#E8D5C8" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="182" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#5B3448">TIENDA TELA</text>
  <text x="112" y="232" font-family="Arial, sans-serif" font-size="28" letter-spacing="2" fill="#845D50">BOLSAS, MODA REGIONAL Y HOGAR</text>

  <rect x="112" y="284" width="336" height="122" rx="22" fill="url(#panel)" filter="url(#shadow)"/>
  <text x="140" y="336" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#FFF7EC">LISTA PARA PEDIR</text>
  <text x="140" y="374" font-family="Arial, sans-serif" font-size="18" fill="#F6E3D3">Mira la categoria y elige tu producto</text>

  <g transform="translate(530 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="470" rx="30" fill="#F7F0EA" stroke="#E2CDBB"/>
    <rect x="28" y="30" width="464" height="130" rx="22" fill="#FFF" stroke="#E9D8CF"/>
    <rect x="54" y="58" width="124" height="74" rx="20" fill="#DDBD79"/>
    <path d="M76 74h80l-10 38H86z" fill="#B07A3E"/>
    <path d="M88 65c0-18 12-30 28-30s28 12 28 30" fill="none" stroke="#B07A3E" stroke-width="10" stroke-linecap="round"/>
    <text x="208" y="90" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#5B3448">Bolsas y mochilas</text>
    <text x="208" y="122" font-family="Arial, sans-serif" font-size="16" fill="#8C7B71">Reforzadas, bonitas y de uso diario</text>

    <rect x="28" y="178" width="220" height="130" rx="22" fill="#FFF" stroke="#E9D8CF"/>
    <path d="M70 240c0-30 22-52 50-52s50 22 50 52" fill="none" stroke="#9F5D77" stroke-width="10" stroke-linecap="round"/>
    <path d="M72 242h96v38c0 16-12 28-28 28H100c-16 0-28-12-28-28z" fill="#B66E8E"/>
    <text x="128" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5B3448">Bolsas</text>

    <rect x="264" y="178" width="228" height="130" rx="22" fill="#FFF" stroke="#E9D8CF"/>
    <path d="M308 250c0-28 22-50 50-50s50 22 50 50v58h-100z" fill="#6986A9"/>
    <rect x="326" y="208" width="64" height="30" rx="14" fill="#EADBCF"/>
    <path d="M322 208c0-18 16-32 36-32s36 14 36 32" fill="none" stroke="#3D5E79" stroke-width="8" stroke-linecap="round"/>
    <text x="412" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#5B3448">Mochilas</text>

    <rect x="28" y="328" width="464" height="112" rx="22" fill="url(#gold)" opacity="0.95"/>
    <text x="56" y="373" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#5B3448">Cuida tu casa con estilo</text>
    <text x="56" y="406" font-family="Arial, sans-serif" font-size="18" fill="#69442E">Sabanas, edredones, colchas y cubrecamas</text>
