<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limpiar cache VNDRX</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4eddf;
        color: #13251d;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(520px, calc(100vw - 32px));
        background: #fffaf2;
        border: 1px solid #e5d7bd;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 18px 42px rgba(55, 45, 25, 0.14);
      }
      h1 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
        font-size: 30px;
      }
      p {
        line-height: 1.6;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        background: #4f7a5b;
        color: white;
        padding: 14px 18px;
        font-weight: 800;
        cursor: pointer;
      }
      #status {
        margin-top: 14px;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Actualizar VNDRX</h1>
      <p>Esta pantalla borra el cache antiguo de la app y vuelve a abrir la tienda actualizada.</p>
      <button id="clean">Limpiar y abrir tienda nueva</button>
      <div id="status">Listo para limpiar.</div>
    </main>
    <script>
      async function clearVndrx() {
        const status = document.getElementById("status");
        status.textContent = "Limpiando service worker y cache...";

        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
        } catch {}

        try {
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } catch {}

        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch {}

        status.textContent = "Cache limpio. Abriendo version nueva...";
        setTimeout(() => {
          location.replace("./?updated=" + Date.now());
        }, 700);
      }

      document.getElementById("clean").addEventListener("click", clearVndrx);
      clearVndrx();
    </script>
  </body>
</html>
