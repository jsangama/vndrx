<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a0e"/>
      <stop offset="55%" stop-color="#162014"/>
      <stop offset="100%" stop-color="#1e2d1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="105" cy="110" r="140" fill="#4a9e3f" opacity="0.14"/>
  <circle cx="1100" cy="1450" r="180" fill="#f0c040" opacity="0.10"/>
  <rect x="70" y="70" width="1060" height="1460" rx="48" fill="#101b0f" stroke="#253823" stroke-width="3" filter="url(#shadow)"/>

  <text x="600" y="175" text-anchor="middle" fill="#f0c040" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="4">VNDRX</text>
  <text x="600" y="240" text-anchor="middle" fill="#f5edd6" font-family="Georgia, serif" font-size="58" font-weight="700">Escanea y pide</text>
  <text x="600" y="292" text-anchor="middle" fill="#c8bc9a" font-family="Segoe UI, Arial, sans-serif" font-size="24">Entra directo a la tienda y haz tu pedido en WhatsApp</text>

  <rect x="195" y="360" width="810" height="810" rx="44" fill="#ffffff" stroke="#f0c040" stroke-width="10"/>
  <image href="./app-qr.png" x="255" y="420" width="690" height="690" preserveAspectRatio="xMidYMid meet"/>

  <rect x="240" y="1235" width="720" height="86" rx="43" fill="url(#gold)"/>
  <text x="600" y="1288" text-anchor="middle" fill="#0f1a0e" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900">https://jsangama.github.io/vndrx/</text>

  <text x="600" y="1410" text-anchor="middle" fill="#f5edd6" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Pedido rapido, seguro y listo para vender</text>
  <text x="600" y="1460" text-anchor="middle" fill="#7a9474" font-family="Segoe UI, Arial, sans-serif" font-size="22">Comparte este QR por Facebook, Instagram, WhatsApp y flyers</text>
</svg>
